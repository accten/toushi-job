# 这是 **wheel dev 模式** 读的 Tauri 配置（standalone 模式读的是
# src-tauri/tauri.conf.json，编译期被 generate_context! 烧进 Rust binary）。
# 两份是**同一个 App 的两种运行模式各一份**，不是冗余，删任何一份对应模式起不来。
#
# ⚠️ 共享字段（productName / identifier / 窗口 title·label·width·height·
# minWidth·minHeight / withGlobalTauri）必须跟 src-tauri/tauri.conf.json **逐字一致**，
# 改一份记得同步改另一份。version 例外：release 时 scripts/set_version.py 会从 git
# tag 把两份一起覆盖，平时不用手动对齐。（tauri.conf.json 是 JSON 不能写注释，
# 所以这条提醒只放这里。）
"$schema" = "https://schema.tauri.app/config/2"
productName = "Toushi"
version = "0.6.0"
identifier = "com.longsizhuo.toushi"

[build]
# 相对本文件所在目录（__init__.py 的 SRC_TAURI_DIR）解析。
# tauri-ui/vite.config.ts 的 build.outDir 必须构建到同一个目录。
frontendDist = "./frontend"

# 窗口图标 / 关于面板图标。路径相对本文件（包内 icons/），
# 由 scripts/set_app_icon.py 一并生成；改图标只用重跑那个脚本。
# standalone 那份配置（src-tauri/tauri.conf.json）指向 src-tauri/icons/，两边内容一致。
[bundle]
icon = [
    "icons/32x32.png",
    "icons/128x128.png",
    "icons/128x128@2x.png",
    "icons/icon.icns",
    "icons/icon.ico",
]

[app]
withGlobalTauri = true

[[app.windows]]
title = "投石 · Toushi"
label = "main"
width = 1200
height = 800
minWidth = 760
minHeight = 560
